# -----------------------------------------------------
# Source colors
# -----------------------------------------------------
source = ~/.config/hypr/colors.conf

# -----------------------------------------------------
# Color Mapping
# -----------------------------------------------------
background = $background
base = $surface
text = $on_surface
alternate_base = $surface_variant
bright_text = $on_primary_container
accent = $primary
accent_secondary = $secondary
# -----------------------------------------------------
# Typography
# -----------------------------------------------------
h1_size = 24
h2_size = 20
h3_size = 16
font_size = 12
small_font_size = 10

font_family = sans-serif
font_family_monospace = monospace

# -----------------------------------------------------
# Theming & UI
# -----------------------------------------------------
icon_theme = Tela-circle-grey
rounding_large = 12
rounding_small = 6
